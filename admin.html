// ==========================================
// FALLBACK COST LOGIC FOR OLD ORDERS
// ==========================================
function parseProductCost(costStr, selectedVariant) {
    const raw = String(costStr || '0').trim();
    if (!raw || raw === '0' || raw === 'undefined' || raw === 'null') return 0;
    const hasVariantCost = raw.includes(':');
    const cleanVariant = String(selectedVariant || '').trim().toLowerCase();
    if (hasVariantCost && cleanVariant) {
        const parts = raw.split(',');
        let matched = parts.find(p => p.trim().split(':')[0].trim().toLowerCase() === cleanVariant);
        if (!matched) { matched = parts.find(p => { const n = p.trim().split(':')[0].trim().toLowerCase(); return n.includes(cleanVariant) || cleanVariant.includes(n); }); }
        if (matched) { const val = parseFloat(matched.trim().split(':')[1]); if (!isNaN(val)) return val; }
        return 0;
    }
    if (!hasVariantCost) { const val = parseFloat(raw); return isNaN(val) ? 0 : val; }
    return 0;
}

function calculateActualCourier(items) {
    let charge = 0; const baseDelivery = parseFloat(localData.settings.deliverycharge) || 0;
    items.forEach((item, index) => {
        const prod = localData.products.find(p => String(p.id) === String(item.id));
        const qty = parseInt(item.quantity || item.qty) || 1; let extraDel = 0;
        if (prod) {
            if (item.selectedVariant && prod.variants && Array.isArray(prod.variants)) { const v = prod.variants.find(v => v.name.toLowerCase() === item.selectedVariant.toLowerCase()); if (v) extraDel = parseFloat(v.extradeliverycharge) || 0; }
            else { extraDel = parseFloat(prod.extradeliverycharge) || 0; }
        }
        if (index === 0) charge += baseDelivery;
        charge += (qty * extraDel);
    });
    return charge;
}

window.onload = () => { if(adminSecret){document.getElementById('adminSecretInput').value=adminSecret;loginAdmin();} };

function loginAdmin() {
    const s=document.getElementById('adminSecretInput').value.trim(); if(!s) return Swal.fire('Error','Enter key','error');
    document.getElementById('loginBtnText').innerText="Connecting..."; document.getElementById('loginSpinner').classList.remove('hidden');
    google.script.run.withSuccessHandler(r=>{
        document.getElementById('loginBtnText').innerText="Login"; document.getElementById('loginSpinner').classList.add('hidden');
        if(r.success){adminSecret=s;sessionStorage.setItem('adminSecret',s);localData={...localData,...r.data};document.getElementById('loginScreen').classList.add('hidden');document.getElementById('adminPanel').classList.remove('hidden');switchTab('dashboard');}
        else{Swal.fire('Denied',r.error,'error');sessionStorage.removeItem('adminSecret');}
    }).withFailureHandler(e=>{document.getElementById('loginBtnText').innerText="Login";document.getElementById('loginSpinner').classList.add('hidden');Swal.fire('Error',e.toString(),'error');}).getAdminData(s);
}

function logoutAdmin(){sessionStorage.removeItem('adminSecret');window.location.reload();}

function fetchData(){if(!adminSecret)return;Swal.fire({title:'Syncing...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});google.script.run.withSuccessHandler(r=>{Swal.close();if(r.success){localData={...localData,...r.data};switchTab(document.querySelector('.nav-tab.active')?.id?.replace('nav-','')||'dashboard');Swal.fire({title:'Synced!',icon:'success',timer:800,showConfirmButton:false});}}).withFailureHandler(e=>Swal.fire('Error',e.toString(),'error')).getAdminData(adminSecret);}

function clearAllCache(){Swal.fire({title:'সার্ভার ক্যাশ ক্লিয়ার করবেন?',text:'ওয়েবসাইটে নতুন ডাটা আনতে ক্যাশ ক্লিয়ার করুন',icon:'warning',showCancelButton:true,confirmButtonText:'হ্যাঁ, ক্লিয়ার করুন'}).then(r=>{if(r.isConfirmed){google.script.run.withSuccessHandler(r=>{if(r.success)Swal.fire({title:'✅ ক্যাশ ক্লিয়ার হয়েছে!',icon:'success',timer:1500,showConfirmButton:false});else Swal.fire('Error',r.error,'error');}).withFailureHandler(e=>Swal.fire('Error',e.toString(),'error')).apiClearAllCache(adminSecret);}});}

function switchTab(t){document.querySelectorAll('.nav-tab').forEach(e=>e.classList.remove('active'));document.getElementById(`nav-${t}`)?.classList.add('active');const c=document.getElementById('contentArea');if(t==='dashboard')renderDashboard(c);else if(t==='orders')renderOrders(c);else if(t==='products')renderProducts(c);else if(SHEET_CONFIGS[t])renderGenericSheet(c,t);}

// ==========================================
// ADVANCED PROFESSIONAL DASHBOARD
// ==========================================
let dashboardFilter = 'all';
let inventorySort = 'most'; // 'most' বা 'least'

function renderDashboard(c) {
    const allOrders = localData.orders || [];
    const products = localData.products || [];
    
    let totalInventoryCost = 0;
    products.forEach(p => {
        if (p.variants && p.variants.length > 0) {
            p.variants.forEach(v => {
                let cost = parseProductCost(p.costprice, v.name);
                if (cost === 0) cost = parseFloat(p.costprice) || 0;
                totalInventoryCost += (cost * (v.stock || 0));
            });
        } else {
            let cost = parseFloat(p.costprice) || 0;
            totalInventoryCost += (cost * (p.totalstock || 0));
        }
    });

    let startDate = new Date('2020-01-01T00:00:00');
    const now = new Date();
    
    if (dashboardFilter === 'today') {
        startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    } else if (dashboardFilter === '7d') {
        startDate = new Date(now); startDate.setDate(now.getDate() - 7);
    } else if (dashboardFilter === '30d') {
        startDate = new Date(now); startDate.setDate(now.getDate() - 30);
    }

    const filteredOrders = allOrders.filter(o => {
        try {
            const orderDate = new Date(o[0]);
            return orderDate >= startDate && orderDate <= now;
        } catch(e) { return false; }
    });

    // ==========================================
    // স্ট্যাটাস অনুযায়ী অর্ডার আলাদা করা হলো
    // ==========================================
    let deliveredOrders = filteredOrders.filter(o => String(o[10]).toLowerCase() === 'delivered');
    let cancelledOrders = filteredOrders.filter(o => String(o[10]).toLowerCase() === 'cancelled');
    let returnOrders = filteredOrders.filter(o => String(o[10]).toLowerCase() === 'return');
    let exchangeOrders = filteredOrders.filter(o => String(o[10]).toLowerCase().includes('exchange'));
    let shippedOrders = filteredOrders.filter(o => String(o[10]).toLowerCase() === 'shipped');
    let processingOrders = filteredOrders.filter(o => String(o[10]).toLowerCase() === 'processing');
    
    let totalRevenue = deliveredOrders.reduce((sum, o) => sum + (parseFloat(o[9]) || 0), 0);
    let totalProfit = 0;
    let sReturnLoss = 0;
    let sExchangeLoss = 0;
    
    // ১. ডেলিভার্ড অর্ডারের প্রফিট যোগ
    deliveredOrders.forEach(o => {
        try { 
            let pc = parseFloat(o[20])||0;
            let dc = parseFloat(o[21])||0;
            if(pc===0 && dc===0) {
                try {
                    const it = JSON.parse(o[7]||"[]");
                    it.forEach(i => {
                        const p = localData.products.find(x => String(x.id) === String(i.id));
                        if(p) pc += parseProductCost(p.costprice, i.selectedVariant) * (parseInt(i.quantity||i.qty)||1);
                    });
                    dc = calculateActualCourier(it);
                } catch(e){}
            }
            totalProfit += (parseFloat(o[9])||0) - pc - dc - (parseFloat(o[19])||0); 
        } catch(e){}
    });

    // ২. রিটার্ন অর্ডারের লস বাদ (আলাদাভাবে হিসাব রাখা হলো)
    returnOrders.forEach(o => {
        try {
            let dc = parseFloat(o[21])||0;
            if(dc === 0) {
                try {
                    const it = JSON.parse(o[7]||"[]");
                    dc = calculateActualCourier(it);
                } catch(e){}
            }
            const ex = parseFloat(o[19])||0;
            const loss = dc + ex;
            sReturnLoss += loss;
            totalProfit -= loss; 
        } catch(e){}
    });

    // ৩. এক্সচেঞ্জ অর্ডারের হিসাব (FIXED: আগের লাভ থেকে নতুন কুরিয়ার বাদ)
    exchangeOrders.forEach(o => {
        try {
            let pc = parseFloat(o[20])||0;
            let dc = parseFloat(o[21])||0;
            if(pc===0 && dc===0) {
                try {
                    const it = JSON.parse(o[7]||"[]");
                    it.forEach(i => {
                        const p = localData.products.find(x => String(x.id) === String(i.id));
                        if(p) pc += parseProductCost(p.costprice, i.selectedVariant) * (parseInt(i.quantity||i.qty)||1);
                    });
                    dc = calculateActualCourier(it);
                } catch(e){}
            }
            const ex = parseFloat(o[19])||0;
            
            // এক্সচেঞ্জ হলেও মূল পণ্যের টাকা আয় হয়ে গেছে, তাই সেই হিসাবের সাথে নতুন কুরিয়ার খরচ বাদ দেওয়া হচ্ছে
            const orderProfit = (parseFloat(o[9])||0) - pc - dc - ex;
            
            sExchangeLoss += ex; // কার্ডে শুধু খরচ দেখানোর জন্য
            totalProfit += orderProfit; // নেট প্রফিটে যোগ হবে (লাভ থাকলে যোগ বিয়োগ হবে, লস হলে মাইনাস হবে)
        } catch(e){}
    });
    const productSalesMap = {};
    
    products.forEach(p => {
        if (p.variants && p.variants.length > 0) {
            p.variants.forEach(v => {
                const key = `${String(p.id).trim()}__${v.name}`;
                productSalesMap[key] = { 
                    id: String(p.id).trim(), variant: v.name, totalQty: 0, totalRevenue: 0, 
                    currentStock: v.stock || 0,
                    costPrice: parseProductCost(p.costprice, v.name) || parseFloat(p.costprice) || 0,
                    name: p.name, image: p.imagemain, stockStatus: p.stockstatus || 'In Stock'
                };
            });
        } else {
            const key = `${String(p.id).trim()}__DEFAULT`;
            productSalesMap[key] = { 
                id: String(p.id).trim(), variant: 'নেই', totalQty: 0, totalRevenue: 0, 
                currentStock: p.totalstock || 0,
                costPrice: parseFloat(p.costprice) || 0,
                name: p.name, image: p.imagemain, stockStatus: p.stockstatus || 'In Stock'
            };
        }
    });

    filteredOrders.forEach(o => {
        if (String(o[10]).toLowerCase() !== 'delivered' && String(o[10]).toLowerCase() !== 'shipped') return;
        try {
            const items = JSON.parse(o[7] || "[]");
            items.forEach(item => {
                const pId = String(item.id || '').trim();
                const vName = item.selectedVariant || 'DEFAULT';
                const key = `${pId}__${vName}`;
                if (productSalesMap[key]) {
                    const qty = parseInt(item.quantity || item.qty) || 1;
                    const revenue = parseFloat(item.price) || 0;
                    productSalesMap[key].totalQty += qty;
                    productSalesMap[key].totalRevenue += (revenue * qty);
                }
            });
        } catch(e) {}
    });

    const sortedProducts = Object.values(productSalesMap).sort((a, b) => {
        return inventorySort === 'most' ? (b.totalQty - a.totalQty) : (a.totalQty - b.totalQty);
    });

    const filterBtns = [
        { key: 'all', label: 'সব সময়' },
        { key: 'today', label: 'আজকে' },
        { key: '7d', label: 'গত ৭ দিন' },
        { key: '30d', label: 'গত ৩০ দিন' }
    ];

    const tableRows = sortedProducts.map((p, i) => {
        let stockBg = 'bg-green-50 text-green-700';
        if (p.currentStock === 0) stockBg = 'bg-red-50 text-red-600';
        else if (p.currentStock <= 5) stockBg = 'bg-yellow-50 text-yellow-700';
        const zeroSalesBadge = p.totalQty === 0 ? '<span class="bg-red-100 text-red-600 text-[9px] px-1.5 py-0.5 rounded-full font-bold ml-2">বিক্রি নেই</span>' : '';
        const costDisplay = p.costPrice > 0 ? `৳${p.costPrice}` : '<span class="text-gray-400">N/A</span>';
        return `
            <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                <td class="p-2.5 text-center text-xs font-bold text-gray-400">${i + 1}</td>
                <td class="p-2.5">
                    <div class="flex items-center gap-3">
                        <img src="${p.image || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-lg object-cover border border-gray-200 shrink-0" onerror="this.src='https://via.placeholder.com/40'">
                        <div class="min-w-0">
                            <p class="text-xs font-bold text-gray-800 truncate max-w-[150px]" title="${p.name}">${p.name}</p>
                            <p class="text-[10px] text-gray-400 font-mono">ID: ${p.id}</p>
                        </div>
                    </div>
                </td>
                <td class="p-2.5 text-center">
                    <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${p.variant !== 'নেই' ? 'bg-blue-50 text-blue-700' : 'text-gray-400'}">${p.variant}</span>
                </td>
                <td class="p-2.5 text-center text-xs font-bold ${stockBg} rounded-lg">${p.currentStock} টি</td>
                <td class="p-2.5 text-center">
                    <span class="text-sm font-black text-gray-800">${p.totalQty} টি</span>
                    ${zeroSalesBadge}
                </td>
                <td class="p-2.5 text-right text-xs text-gray-600">${costDisplay}</td>
                <td class="p-2.5 text-right text-sm font-bold text-green-700">৳${p.totalRevenue.toLocaleString()}</td>
            </tr>
        `;
    }).join('');

    const totalOrders = filteredOrders.length;
    const successRate = totalOrders > 0 ? ((deliveredOrders.length / totalOrders) * 100).toFixed(1) : 0;

    c.innerHTML = `
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-5 mb-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center text-lg"><i class="fas fa-warehouse"></i></div>
                <div><p class="text-xs text-gray-500 font-bold uppercase">ইনভেন্টরি ভ্যালু</p><p class="text-2xl font-black text-gray-800">৳${totalInventoryCost.toLocaleString()}</p><p class="text-[10px] text-gray-400">(ক্রয়মূল্য অনুযায়ী)</p></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center text-lg"><i class="fas fa-shopping-cart"></i></div>
                <div><p class="text-xs text-gray-500 font-bold uppercase">মোট অর্ডার</p><p class="text-2xl font-black text-gray-800">${totalOrders}</p><p class="text-[10px] text-gray-400">(${dashboardFilter === 'all' ? 'সব সময়' : dashboardFilter === 'today' ? 'আজকে' : dashboardFilter === '7d' ? 'গত ৭ দিন' : 'গত ৩০ দিন'})</p></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-green-100 text-green-600 flex items-center justify-center text-lg"><i class="fas fa-check-double"></i></div>
                <div><p class="text-xs text-gray-500 font-bold uppercase">ডেলিভারি ও আয়</p><p class="text-2xl font-black text-gray-800">৳${totalRevenue.toLocaleString()}</p><p class="text-[10px] text-gray-400">${deliveredOrders.length}টি ডেলিভারি</p></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl ${totalProfit >= 0 ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'} flex items-center justify-center text-lg"><i class="fas fa-${totalProfit >= 0 ? 'trending-up' : 'trending-down'}"></i></div>
                <div><p class="text-xs text-gray-500 font-bold uppercase">নেট প্রফিট</p><p class="text-2xl font-black ${totalProfit >= 0 ? 'text-emerald-700' : 'text-red-700'}">৳${totalProfit.toFixed(0)}</p><p class="text-[10px] text-gray-400">রিটার্ন ও এক্সচেঞ্জ লস বাদ</p></div>
            </div>
        </div>

        <!-- উপরের সারি: মূল স্ট্যাটাসগুলো -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
            <div class="bg-yellow-50 border border-yellow-200 p-4 rounded-xl text-center">
                <p class="text-2xl font-black text-yellow-700">${processingOrders.length}</p>
                <p class="text-xs font-bold text-yellow-500 mt-1">প্রসেসিং</p>
            </div>
            <div class="bg-indigo-50 border border-indigo-200 p-4 rounded-xl text-center">
                <p class="text-2xl font-black text-indigo-700">${shippedOrders.length}</p>
                <p class="text-xs font-bold text-indigo-500 mt-1">শিপড</p>
            </div>
            <div class="bg-green-50 border border-green-200 p-4 rounded-xl text-center">
                <p class="text-2xl font-black text-green-700">${deliveredOrders.length}</p>
                <p class="text-xs font-bold text-green-500 mt-1">ডেলিভার্ড</p>
            </div>
            <div class="bg-gray-50 border border-gray-200 p-4 rounded-xl text-center">
                <p class="text-2xl font-black text-gray-600">${cancelledOrders.length}</p>
                <p class="text-xs font-bold text-gray-500 mt-1">ক্যান্সেলড</p>
                <p class="text-[9px] text-gray-400 mt-1">কোনো লস নেই</p>
            </div>
        </div>

        <!-- নিচের সারি: লস ও সাফল্যতার হার -->
        <div class="grid grid-cols-3 gap-4 mb-6">
            <div class="bg-orange-50 border border-orange-200 p-4 rounded-xl text-center">
                <p class="text-2xl font-black text-orange-700">${returnOrders.length}</p>
                <p class="text-xs font-bold text-orange-500 mt-1">রিটার্ন</p>
                <p class="text-[10px] text-orange-600 font-black mt-1 bg-orange-100 rounded py-0.5">-৳${sReturnLoss.toFixed(0)} লস</p>
            </div>
            <div class="bg-pink-50 border border-pink-200 p-4 rounded-xl text-center">
                <p class="text-2xl font-black text-pink-700">${exchangeOrders.length}</p>
                <p class="text-xs font-bold text-pink-500 mt-1">এক্সচেঞ্জ</p>
                <p class="text-[10px] text-pink-600 font-black mt-1 bg-pink-100 rounded py-0.5">-৳${sExchangeLoss.toFixed(0)} লস</p>
            </div>
            <div class="bg-teal-50 border border-teal-200 p-4 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-teal-100 transition" onclick="switchTab('orders')">
                <p class="text-2xl font-black text-teal-700">${successRate}%</p>
                <p class="text-xs font-bold text-teal-500 mt-1">সাফল্যতা হার <i class="fas fa-arrow-right ml-1 text-[10px]"></i></p>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-6">
            <div class="p-4 border-b bg-gray-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                <div>
                    <h3 class="font-bold text-sm text-gray-700"><i class="fas fa-chart-bar text-blue-500 mr-2"></i>পণ্য ও ভ্যারিয়েন্ট বিক্রি রিপোর্ট</h3>
                    <p class="text-[10px] text-gray-400 mt-0.5">সকল পণ্যের বর্তমান স্টক, বিক্রি সংখ্যা এবং আয় দেখুন</p>
                </div>
                <div class="flex flex-wrap gap-2">
                    <div class="flex bg-gray-200 p-0.5 rounded-lg">
                        ${filterBtns.map(btn => `
                            <button onclick="setDashboardFilter('${btn.key}')" class="px-3 py-1 text-[10px] font-bold rounded-md transition ${dashboardFilter === btn.key ? 'bg-gray-700 text-white shadow-sm' : 'text-gray-600 hover:bg-gray-100'}">${btn.label}</button>
                        `).join('')}
                    </div>
                    <div class="flex bg-blue-100 p-0.5 rounded-lg">
                        <button onclick="setInventorySort('most')" class="px-3 py-1 text-[10px] font-bold rounded-md transition ${inventorySort === 'most' ? 'bg-blue-600 text-white shadow-sm' : 'text-blue-700 hover:bg-blue-200'}">সর্বোচ্চ বিক্রি</button>
                        <button onclick="setInventorySort('least')" class="px-3 py-1 text-[10px] font-bold rounded-md transition ${inventorySort === 'least' ? 'bg-blue-600 text-white shadow-sm' : 'text-blue-700 hover:bg-blue-200'}">সর্বনিম্ন বিক্রি</button>
                    </div>
                </div>
            </div>
            <div class="p-0 overflow-x-auto tbl-wrap" style="max-height: 500px; overflow-y: auto;">
                <table class="w-full text-left">
                    <thead class="sticky top-0 bg-white z-10">
                        <tr class="bg-gray-100 text-[10px] text-gray-500 uppercase tracking-wider border-b">
                            <th class="p-2.5 font-bold text-center w-10">#</th>
                            <th class="p-2.5 font-bold">পণ্য</th>
                            <th class="p-2.5 font-bold text-center">ভ্যারিয়েন্ট</th>
                            <th class="p-2.5 font-bold text-center">বর্তমান স্টক</th>
                            <th class="p-2.5 font-bold text-center">মোট বিক্রি</th>
                            <th class="p-2.5 font-bold text-right">ক্রয়মূল্য</th>
                            <th class="p-2.5 font-bold text-right">মোট আয়</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sortedProducts.length > 0 ? tableRows : `
                            <tr><td colspan="7" class="p-8 text-center text-sm text-gray-400">${dashboardFilter === 'all' ? 'কোনো পণ্য নেই' : 'এই সময়ে কোনো বিক্রি হয়নি'}</td></tr>
                        `}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}
// ড্যাশবোর্ড ফিল্টার বাটনে ক্লিক করার ফাংশন
function setDashboardFilter(filter) {
    dashboardFilter = filter;
    renderDashboard(document.getElementById('contentArea'));
}

// ইনভেন্টরি সর্ট বাটনে ক্লিক করার ফাংশন
function setInventorySort(sort) {
    inventorySort = sort;
    renderDashboard(document.getElementById('contentArea'));
}
// ==========================================
// GENERIC SHEET RENDERER
// ==========================================
function renderGenericSheet(c, key) {
    const config=SHEET_CONFIGS[key]; let rawData=localData[key]||[];
    if(key==='settings'&&!Array.isArray(rawData)) rawData=Object.entries(rawData).map(([k,v])=>[k,v]);
    
    const thead=config.fields.filter(f=>f.type!=='hidden').map(f=>`<th class="p-2 text-[10px] font-bold uppercase text-left">${f.label.split('*')[0].trim()}</th>`).join('')+'<th class="p-2 text-[10px] font-bold">Act</th>';
    const tbody=rawData.map((row,idx)=>{
        const tds=config.fields.filter(f=>f.type!=='hidden').map((f,i)=>{
            const realIdx = config.fields.indexOf(f);
            let val=row[realIdx]!==undefined?row[realIdx]:'';
            if(f.type==='date'&&val){try{val=new Date(val).toISOString().split('T')[0];}catch(e){}}
            let disp=String(val);
            if(f.type==='url'&&val) disp=`<img src="${val}" class="img-thumb" onerror="this.outerHTML='${val}'">`;
            if(f.id==='f5'&&key==='reviews'){const clr=String(val)==='active'?'text-green-600':String(val)==='rejected'?'text-red-600':'text-yellow-600';disp=`<span class="font-bold ${clr}">${val}</span>`;}
            if(f.id==='f7'&&key==='coupons'){const clr=String(val)==='active'?'text-green-600':'text-red-600';disp=`<span class="font-bold ${clr}">${val}</span>`;}
            if(f.id==='f4'&&key==='popups'){const clr=String(val)==='active'?'text-green-600':'text-red-600';disp=`<span class="font-bold ${clr}">${val}</span>`;}
            return `<td class="p-2 text-xs border-b border-gray-100 max-w-[150px] truncate" title="${String(val)}">${disp}</td>`;
        }).join('');
        const kv=String(row[config.keyCol]||'').trim();
        const isRO=key==='reviews';
        return `<tr class="hover:bg-gray-50">${tds}<td class="p-2 border-b border-gray-100 whitespace-nowrap">${!isRO?`<button onclick="openGenericModal('${key}',${idx})" class="text-blue-500 hover:bg-blue-100 p-1 rounded text-xs"><i class="fas fa-edit"></i></button>`:''}<button onclick="deleteGenericRow('${key}','${kv.replace(/'/g,"\\'")}')" class="text-red-500 hover:bg-red-100 p-1 rounded text-xs ml-1"><i class="fas fa-trash"></i></button></td></tr>`;
    }).join('');

    c.innerHTML=`<div class="bg-white rounded-xl shadow-sm border overflow-hidden"><div class="p-4 border-b bg-gray-50 flex justify-between items-center"><h3 class="font-bold text-sm text-gray-700">${config.title} Management</h3><button onclick="openGenericModal('${key}')" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg font-bold text-xs hover:bg-blue-700"><i class="fas fa-plus mr-1"></i>Add New</button></div><div class="tbl-wrap overflow-x-auto"><table class="w-full text-left min-w-[800px]"><thead><tr class="bg-gray-100 text-gray-600">${thead}</tr></thead><tbody>${tbody}</tbody></table></div></div>`;
}

function openGenericModal(key, idx=null) {
    const config=SHEET_CONFIGS[key]; let rawData=localData[key]||[];
    if(key==='settings'&&!Array.isArray(rawData)) rawData=Object.entries(rawData).map(([k,v])=>[k,v]);
    
    currentEditSheet=key; currentEditKey='';
    document.getElementById('genericModalTitle').innerText=idx!==null?`Edit ${config.title}`:`Add ${config.title}`;

    const html=config.fields.map((f,i)=>{
        if(f.type==='hidden') return '';
        let val=(idx!==null&&rawData[idx])?(rawData[idx][i]!==undefined?rawData[idx][i]:''):'';
        if(f.type==='date'&&val){try{val=new Date(val).toISOString().split('T')[0];}catch(e){}}
        if(idx!==null&&i===config.keyCol) currentEditKey=String(val).trim();
        
        let input='';
        const ro=f.readOnly?'readonly class="bg-gray-100 cursor-not-allowed"':'';
        if(f.type==='textarea') input=`<textarea id="gen_f${i}" ${ro} class="w-full border rounded-lg p-2.5 text-sm">${val}</textarea>`;
        else if(f.type==='select') input=`<select id="gen_f${i}" ${ro} class="w-full border rounded-lg p-2.5 text-sm">${f.options.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}</select>`;
        else input=`<input type="${f.type||'text'}" id="gen_f${i}" value="${val}" ${ro} class="w-full border rounded-lg p-2.5 text-sm">`;
        
        return `<div class="${f.colSpan?'col-span-'+f.colSpan:''}"><label class="font-bold block mb-1 text-xs text-gray-700">${f.label}</label>${input}${f.help?`<p class="text-[10px] text-blue-500 mt-1 leading-relaxed">${f.help}</p>`:''}</div>`;
    }).join('');

    document.getElementById('genericModalBody').innerHTML=`<div class="grid grid-cols-2 gap-x-5 gap-y-4">${html}</div>`;
    document.getElementById('genericModal').classList.remove('hidden');document.getElementById('genericModal').classList.add('flex');
}
function closeGenericModal(){document.getElementById('genericModal').classList.add('hidden');document.getElementById('genericModal').classList.remove('flex');}

function saveGenericData() {
    const config=SHEET_CONFIGS[currentEditSheet];
    const dataArray=config.fields.map((f,i)=>{
        const el=document.getElementById(`gen_f${i}`);
        let val=el?el.value:'';
        if(currentEditSheet==='settings'&&i===0) val=val.trim().toLowerCase();
        return val;
    });

    Swal.fire({title:'Saving...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
    google.script.run.withSuccessHandler(res=>{
        if(res.success){
            Swal.fire('Saved!','','success');closeGenericModal();
            let arr=localData[currentEditSheet]||[];
            if(currentEditSheet==='settings'&&!Array.isArray(arr)) arr=Object.entries(arr).map(([k,v])=>[k,v]);
            const existIdx=arr.findIndex(r=>String(r[config.keyCol]).trim()===currentEditKey);
            if(existIdx>-1) arr[existIdx]=dataArray; else arr.push(dataArray);
            if(currentEditSheet==='settings'){const obj={};arr.forEach(r=>obj[r[0]]=r[1]);localData.settings=obj;}else localData[currentEditSheet]=arr;
            renderGenericSheet(document.getElementById('contentArea'),currentEditSheet);
        }else Swal.fire('Error',res.error,'error');
    }).withFailureHandler(e=>Swal.fire('Error',e.toString(),'error')).adminGenericSave(adminSecret,currentEditSheet,dataArray,currentEditKey||null);
}

function deleteGenericRow(key,kv){
    Swal.fire({title:'Delete?',icon:'warning',showCancelButton:true,confirmButtonColor:'#d33'}).then(r=>{
        if(r.isConfirmed){google.script.run.withSuccessHandler(res=>{if(res.success){let arr=localData[key]||[];if(key==='settings'&&!Array.isArray(arr))arr=Object.entries(arr).map(([k,v])=>[k,v]);localData[key]=arr.filter(r=>String(r[SHEET_CONFIGS[key].keyCol]).trim()!==kv);if(key==='settings'){const obj={};localData[key].forEach(r=>obj[r[0]]=r[1]);localData.settings=obj;}renderGenericSheet(document.getElementById('contentArea'),key);}else Swal.fire('Error',res.error,'error');}).adminGenericDelete(adminSecret,key,kv);}
    });
}
function renderOrders(c){
    const sorted=[...localData.orders].reverse();
    let sP=0, sC=0, sD=0, sE=0, sPr=0, sReturnLoss=0, sExchangeLoss=0;
    
    let trs=sorted.map(o=>{
        const st=String(o[10]||'').trim().toLowerCase();
        const ex=parseFloat(o[19])||0;
        
        let bg='bg-gray-100 text-gray-800',statusText=st;
        if(st==='processing'){bg='bg-yellow-100 text-yellow-800';statusText='Processing';}
        if(st==='shipped'){bg='bg-blue-100 text-blue-800';statusText='Shipped';}
        if(st==='delivered'){bg='bg-green-100 text-green-800';statusText='Delivered';}
        if(st==='return'){bg='bg-orange-100 text-orange-800';statusText='রিটার্নড';}
        if(st==='exchange customer'){bg='bg-cyan-100 text-cyan-800';statusText='এক্সচেঞ্জ (কাস্টমার)';}
        if(st==='exchange seller'){bg='bg-pink-100 text-pink-800';statusText='এক্সচেঞ্জ (সেলার)';}
        if(st==='cancelled'){bg='bg-red-100 text-red-800';statusText='Cancelled';}
        
        let dt='';try{const d=new Date(o[0]);dt=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+', '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:true});}catch(e){}
        const paid=parseFloat(o[9])||0,pc=parseFloat(o[20])||0,dc=parseFloat(o[21])||0;
        
        if(pc===0&&dc===0){try{const it=JSON.parse(o[7]||"[]");it.forEach(i=>{const p=localData.products.find(x=>String(x.id)===String(i.id));if(p)pc+=parseProductCost(p.costprice,i.selectedVariant)*(parseInt(i.quantity||i.qty)||1);});dc=calculateActualCourier(it);}catch(e){}}
        
        // ==========================================
        // স্মার্ট প্রফিট ক্যালকুলেশন (EXCHANGE LOGIC FIXED)
        // ==========================================
        let np = 0;
        let profitClass = 'text-gray-600';
        let profitPrefix = '';
        let profitDisplay = '0'; 
        
        if(st === 'delivered') {
            np = paid - pc - dc - ex;
            profitClass = np >= 0 ? 'text-green-600' : 'text-red-600';
            profitDisplay = np.toFixed(2);
            sP+=paid; sC+=pc; sD+=dc; sE+=ex; sPr+=np;
        } else if (st === 'processing' || st === 'shipped') {
            np = paid - pc - dc - ex;
            profitClass = 'text-purple-600 border border-dashed border-purple-300 rounded-md';
            profitPrefix = '~';
            profitDisplay = np.toFixed(2);
        } else if (st === 'return') {
            // রিটার্ন: পণ্য ফিরে এসেছে, শুধু কুরিয়ার খরচই লস
            const currentLoss = dc + ex;
            np = -currentLoss;
            profitClass = 'text-orange-600';
            profitDisplay = np.toFixed(2);
            sReturnLoss += currentLoss;
            sPr += np; 
        } else if (st.includes('exchange')) {
            // এক্সচেঞ্জ (কাস্টমার/সেলার উভয়): আগের লাভ থেকে নতুন কুরিয়ার খরচ বাদ
            np = paid - pc - dc - ex;
            profitClass = np >= 0 ? 'text-pink-500' : 'text-red-600';
            profitDisplay = np.toFixed(2);
            sPr += np; 
            // ফুটারে শুধুমাত্র নতুন কুরিয়ার খরচটি আলাদা দেখানো হবে
            sExchangeLoss += ex;
        } else if (st === 'cancelled') {
            profitClass = 'text-gray-400';
            profitDisplay = '-';
        }
        
        let itemsHtml='';try{JSON.parse(o[7]||"[]").forEach(i=>{itemsHtml+=`<div class="flex items-center gap-2 py-0.5"><img src="${i.image||'https://via.placeholder.com/24'}" class="img-thumb" onerror="this.src='https://via.placeholder.com/24'"><div class="min-w-0"><div class="text-[11px] font-semibold truncate">${i.name}${i.selectedVariant?' <span class=text-gray-400>['+i.selectedVariant+']</span>':''}</div></div></div>`;});}catch(e){}

        return `<tr class="border-b border-gray-100 hover:bg-gray-50"><td class="p-2 text-[10px] whitespace-nowrap">${dt}</td><td class="p-2 text-[10px] font-mono font-bold">${o[1]}</td><td class="p-2 text-[10px]"><b>${o[2]}</b><br><span class="text-gray-400">${o[3]}</span></td><td class="p-2 max-w-[180px]">${itemsHtml}</td><td class="p-2 text-xs font-bold text-blue-600 whitespace-nowrap">৳${paid.toLocaleString()}</td><td class="p-2 text-[10px] whitespace-nowrap">কস্ট: -৳${pc}<br>কুরিয়ার: -৳${dc}<br><input type="number" value="${ex}" onchange="updateExtraCost('${o[1]}',this.value)" class="w-12 border rounded p-0.5 text-[9px] text-center mt-1"></td><td class="p-2"><span class="px-1.5 py-0.5 rounded text-[9px] font-bold ${bg}">${statusText}</span></td><td class="p-2 text-xs font-black whitespace-nowrap ${profitClass}" title="${(st === 'processing' || st === 'shipped') ? 'সম্ভাব্য প্রফিট' : st === 'cancelled' ? 'কোনো লাভ-লস নেই' : st.includes('exchange') ? 'এক্সচেঞ্জ খরচ বাদ' : 'নেট প্রফিট'}">${profitPrefix}৳${profitDisplay}</td><td class="p-2"><select onchange="updateOrderStatus('${o[1]}',this.value)" class="border rounded p-1 text-[10px]"><option value="">Change</option><option value="Processing" ${st==='processing'?'selected':''}>Processing</option><option value="Shipped" ${st==='shipped'?'selected':''}>Shipped</option><option value="Delivered" ${st==='delivered'?'selected':''}>Delivered</option><option value="Cancelled" ${st==='cancelled'?'selected':''}>Cancelled</option><option value="Returned" ${st==='return'?'selected':''}>রিটার্নড</option><option value="Exchange Customer" ${st==='exchange customer'?'selected':''}>এক্সচেঞ্জ (কাস্টমার)</option><option value="Exchange Seller" ${st==='exchange seller'?'selected':''}>এক্সচেঞ্জ (সেলার)</option></select></td></tr>`;
    }).join('');

    const deliveredProfit = sP - sC - sD - sE;

    c.innerHTML=`<div class="bg-white rounded-xl shadow-sm border overflow-hidden mb-4"><div class="tbl-wrap overflow-x-auto"><table class="w-full text-left min-w-[1100px]"><thead><tr class="bg-gray-100 text-[10px] text-gray-600 uppercase"><th class="p-2">Date</th><th class="p-2">ID</th><th class="p-2">Customer</th><th class="p-2">Products</th><th class="p-2">Paid</th><th class="p-2">Costs</th><th class="p-2">Status</th><th class="p-2">Profit</th><th class="p-2">Action</th></tr></thead><tbody>${trs}</tbody>
    
    <tfoot>
        <tr class="bg-green-50 text-green-800 font-bold text-[10px] border-t border-green-200">
            <td colspan="4" class="p-2 text-right">✅ ডেলিভার্ড (মোট আয় ও লাভ):</td>
            <td class="p-2 text-green-700">+৳${sP.toLocaleString()}</td>
            <td class="p-2 text-gray-600">কস্ট: -৳${sC} | কুরিয়ার: -৳${sD}</td>
            <td></td>
            <td class="p-2 font-black text-green-700">+৳${deliveredProfit.toFixed(0)}</td>
            <td></td>
        </tr>
        <tr class="bg-orange-50 text-orange-800 font-bold text-[10px] border-t border-orange-200">
            <td colspan="7" class="p-2 text-right">🔄 রিটার্ন (মোট লস):</td>
            <td class="p-2 font-black text-orange-700">-৳${sReturnLoss.toFixed(0)}</td>
            <td></td>
        </tr>
        <tr class="bg-pink-50 text-pink-800 font-bold text-[10px] border-t border-pink-200">
            <td colspan="7" class="p-2 text-right">🔁 এক্সচেঞ্জ (মোট নতুন কুরিয়ার খরচ):</td>
            <td class="p-2 font-black text-pink-700">-৳${sExchangeLoss.toFixed(0)}</td>
            <td></td>
        </tr>
        <tr class="bg-blue-100 text-blue-900 font-black text-xs border-t-2 border-blue-400">
            <td colspan="7" class="p-2.5 text-right">চূড়ান্ত নেট প্রফিট:</td>
            <td class="p-2.5 ${sPr>=0?'text-green-800':'text-red-800'}">৳${sPr.toFixed(0)}</td>
            <td></td>
        </tr>
    </tfoot>
    
    </table></div></div>`;
}
function updateExtraCost(id,cost){Swal.fire({title:'Update Extra Cost?',icon:'question',showCancelButton:true}).then(r=>{if(r.isConfirmed){google.script.run.withSuccessHandler(res=>{if(res.success){const o=localData.orders.find(x=>x[1]===id);if(o)o[19]=cost;renderOrders(document.getElementById('contentArea'));}}).adminUpdateOrderExtraCost(adminSecret,id,cost);}else renderOrders(document.getElementById('contentArea'));});}
function updateOrderStatus(id,st){
    if(!st)return;

    // ==========================================
    // ১. রিটার্ন — দুই স্টেপ: Cancelled (রিস্টক) → Return (ডিসপ্লে)
    // ==========================================
    if(st==='Returned'){
        const order = localData.orders.find(x=>x[1]===id) || {};
        const existingExtraCost = parseFloat(order[19]) || 0;
        
        // ১ম বারের কুরিয়ার চার্জ (স্ন্যাপশট) বের করা
        let firstCourier = parseFloat(order[21]) || 0;
        if(firstCourier === 0) {
            try {
                const items = JSON.parse(order[7] || "[]");
                firstCourier = calculateActualCourier(items);
            } catch(e) {}
        }

        // ইনপুট ছাড়া আগে থেকে জমা থাকা খরচ
        const existingLoss = existingExtraCost + firstCourier;

        Swal.fire({
            title:'📦 অর্ডার রিটার্ন',
            html:`
                <p class="text-sm text-gray-800 text-left mb-4"><b>পণ্যটি কাস্টমার রিসিভ করেনি।</b> পণ্যের দাম বাদ দিয়ে শুধু কুরিয়ার ও অন্যান্য খরচগুলো আপনার লস হিসেবে ধরা হবে।</p>
                
                <div class="bg-gray-50 rounded-xl p-4 border border-gray-200 mb-3">
                    <p class="text-[10px] text-gray-500 font-bold mb-2 uppercase tracking-wide">চূড়ান্ত লসের হিসাব</p>
                    <div class="flex items-center justify-center gap-2 sm:gap-3 flex-wrap">
                        <div class="text-center min-w-[80px] bg-white p-2 rounded-lg border">
                            <p class="text-[10px] text-gray-500 mb-1">এক্সট্রা খরচ</p>
                            <p class="text-lg font-black text-gray-700">-৳${existingExtraCost}</p>
                        </div>
                        <span class="text-xl font-black text-gray-300">+</span>
                        <div class="text-center min-w-[80px] bg-white p-2 rounded-lg border">
                            <p class="text-[10px] text-gray-500 mb-1">১ম কুরিয়ার</p>
                            <p class="text-lg font-black text-gray-700">-৳${firstCourier}</p>
                        </div>
                        <span class="text-xl font-black text-gray-300">+</span>
                        <div class="text-center min-w-[90px] bg-red-50 p-2 rounded-lg border-2 border-red-200">
                            <p class="text-[10px] text-red-500 mb-1 font-bold">২য় রিটার্ন কুরিয়ার</p>
                            <input type="number" id="returnCourierInput" value="0" min="0" step="1"
                                oninput="document.getElementById('returnTotalDisplay').textContent='-৳'+(${existingLoss}+parseFloat(this.value||0))"
                                class="w-20 text-center text-lg font-black border-2 border-red-300 rounded-md p-1 focus:ring-2 focus:ring-red-400 outline-none text-red-600">
                        </div>
                        <span class="text-xl font-black text-gray-300">=</span>
                        <div class="text-center min-w-[100px] bg-red-100 p-2.5 rounded-lg border-2 border-red-400 shadow-sm">
                            <p class="text-[10px] text-red-600 mb-1 font-bold">ফাইনাল মোট লস</p>
                            <p id="returnTotalDisplay" class="text-xl font-black text-red-600">-৳${existingLoss}</p>
                        </div>
                    </div>
                </div>
                
                <p class="text-[11px] text-gray-500 text-left leading-relaxed bg-blue-50 p-3 rounded-lg border border-blue-100">
                    <i class="fas fa-info-circle text-blue-500 mr-1"></i> 
                    প্রফিট কলামে এই ফাইনাল লসটি মাইনাস (-) হিসেবে যোগ হবে। রিটার্ন কুরিয়ারে কোনো খরচ না হলে <b>0</b> দিন।
                </p>`,
            showCancelButton:true,
            confirmButtonText:'রিটার্ন কনফার্ম',
            confirmButtonColor:'#d33',
            cancelButtonText:'বাতিল',
            focusConfirm:false,
            preConfirm:()=>{
                const courierCost=parseFloat(document.getElementById('returnCourierInput').value)||0;
                return {courier:courierCost, total: existingExtraCost + courierCost};
            }
        }).then(r=>{
            if(r.isConfirmed){
                const totalCost=r.value.total;
                Swal.fire({title:'প্রসেসিং...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
                // Step 1: Cancelled → রিস্টক হবে
                google.script.run.withSuccessHandler(res=>{
                    if(res.success){
                        // Step 2: Return → ডিসপ্লে পরিবর্তন (রিস্টক হবে না)

                                                <p class="text-red-600 font-bold text-base">মোট ক্ষতি: -৳${finalLoss}</p>
                                            </div>`,icon:'success',timer:4000,showConfirmButton:false});
                                    }else Swal.fire('Error',res3.error,'error');
                                }).withFailureHandler(e=>Swal.fire('Error',e.toString(),'error')).adminUpdateOrderExtraCost(adminSecret,id,totalCost);
                            }else Swal.fire('Error',res2.error,'error');
                        }).withFailureHandler(e=>Swal.fire('Error',e.toString(),'error')).adminUpdateOrderStatus(adminSecret,id,'Return');
                    }else Swal.fire('Error',res.error,'error');
                }).withFailureHandler(e=>Swal.fire('Error',e.toString(),'error')).adminUpdateOrderStatus(adminSecret,id,'Cancelled');
            }
        });
        return;
    }

    // ==========================================
    // ২. এক্সচেঞ্জ (কাস্টমার) — শুধু স্ট্যাটাস পরিবর্তন
    // ==========================================
    if(st==='Exchange Customer'){
        const order=localData.orders.find(x=>x[1]===id);
        let items=[];try{items=JSON.parse(order[7]||"[]");}catch(e){}

                    <p class="text-[10px] text-gray-400">Qty: ${item.quantity||item.qty} | ৳${item.price}</p>
                </div>
            </div>`;
        }).join('');

        Swal.fire({
            title:'📦 এক্সচেঞ্জ (কাস্টমার)',
            html:`
                <p class="text-sm text-gray-500 mb-3">কাস্টমার সাইজ/ভ্যারিয়েন্ট পরিবর্তন চান।<br>ডেলিভারি চার্জ কাস্টমার দেবে।</p>
                <div class="text-left max-h-[220px] overflow-y-auto mb-3">${itemsList}</div>
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-3">
                    <p class="text-xs font-bold text-blue-700 mb-2">📋 ম্যানুয়াল কাজ:</p>
                    <ol class="text-[11px] text-blue-600 space-y-1.5 list-decimal ml-4">
                        <li>Products ট্যাবে যান</li>
                        <li><b>পুরনো ভ্যারিয়েন্ট</b> স্টক <span class="font-bold text-green-700">+১</span></li>
                        <li><b>নতুন ভ্যারিয়েন্ট</b> স্টক <span class="font-bold text-red-600">-১</span></li>
                        <li>কাস্টমার থেকে ডেলিভারি চার্জ নিন</li>
                    </ol>
                </div>
                <div class="bg-cyan-50 border border-cyan-200 rounded-lg p-3">
                    <p class="text-[11px] text-cyan-700 text-center font-bold">স্ট্যাটাস "Exchange Customer" সেভ হবে<br>পরে আবার Shipped → Delivered দিন</p>
                </div>`,
            confirmButtonText:'কনফার্ম',
            confirmButtonColor:'#0891b2',
            showCancelButton:true,
            cancelButtonText:'বাতিল'
        }).then(r=>{
            if(r.isConfirmed){
                Swal.fire({title:'প্রসেসিং...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
                google.script.run.withSuccessHandler(res=>{
                    if(res.success){
                        const o=localData.orders.find(x=>x[1]===id);
                        if(o)o[10]='Exchange Customer';
                        renderOrders(document.getElementById('contentArea'));
                        Swal.fire({title:'স্ট্যাটাস আপডেট হয়েছে!',text:'ইউজার "Exchange Customer" দেখবে',icon:'success',timer:1500,showConfirmButton:false});
                    }else Swal.fire('Error',res.error,'error');
                }).withFailureHandler(e=>Swal.fire('Error',e.toString(),'error')).adminUpdateOrderStatus(adminSecret,id,'Exchange Customer');
            }
        });
        return;
    }

    // ==========================================
    // ৩. এক্সচেঞ্জ (সেলার) — স্ট্যাটাস + ExtraCost
    // ==========================================
    if(st==='Exchange Seller'){
        const order=localData.orders.find(x=>x[1]===id);
        const existingCost=parseFloat(order[19])||0;
        let items=[];try{items=JSON.parse(order[7]||"[]");}catch(e){}

        let damageRef=items.map(item=>{
            const prod=localData.products.find(p=>String(p.id)===String(item.id));
            let cost=0;
            if(prod) cost=parseProductCost(prod.costprice,item.selectedVariant)||parseFloat(prod.costprice)||0;
            const qty=parseInt(item.quantity||item.qty)||1;
            if(cost>0) return `<div class="flex justify-between text-[11px] py-1 border-b border-red-100"><span class="text-red-700">${item.name}${item.selectedVariant?' ['+item.selectedVariant+']':''} × ${qty}</span><span class="font-bold text-red-800">ক্রয়: ৳${(cost*qty).toLocaleString()}</span></div>`;
            return '';
        }).filter(Boolean).join('');

        Swal.fire({
            title:'🔄 এক্সচেঞ্জ (সেলার)',
            html:`
                <p class="text-sm text-gray-500 mb-3">ভুল পণ্য পাঠানো হয়েছে। নতুন পণ্য পাঠাতে হবে।</p>
                ${damageRef?`<div class="bg-red-50 border border-red-200 rounded-lg p-3 mb-3">
                    <p class="text-[10px] font-bold text-red-700 mb-1.5">🔴 ড্যামেজ পণ্য (রিস্টক হবে না, শুধু রেফারেন্স):</p>
                    ${damageRef}
                </div>`:''}
                <div class="flex items-center justify-center gap-2 sm:gap-4 bg-orange-50 rounded-xl p-4 border-2 border-dashed border-orange-300 flex-wrap">
                    <div class="text-center min-w-[80px]">
                        <p class="text-[10px] text-gray-400 mb-1">আগের এক্সট্রা</p>
                        <p class="text-xl font-black text-gray-600">৳${existingCost}</p>
                    </div>
                    <span class="text-2xl font-black text-gray-300">+</span>
                    <div class="text-center">
                        <p class="text-[10px] text-orange-500 mb-1 font-bold">নতুন কুরিয়ার</p>
                        <input type="number" id="exSellerCourier" value="0" min="0" step="1"
                            oninput="document.getElementById('exSellerTotal').textContent='৳'+(${existingCost}+parseFloat(this.value||0))"
                            class="w-24 text-center text-xl font-black border-2 border-orange-300 rounded-lg p-2 focus:ring-2 focus:ring-orange-400 outline-none">
                    </div>
                    <span class="text-2xl font-black text-gray-300">=</span>
                    <div class="text-center min-w-[80px]">
                        <p class="text-[10px] text-orange-600 mb-1 font-bold">মোট লস সেভ</p>
                        <p id="exSellerTotal" class="text-xl font-black text-orange-600">৳${existingCost}</p>
                    </div>
                </div>
                <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-3 mt-3 mb-3">
                    <p class="text-[10px] font-bold text-yellow-700 mb-1.5">⚠️ ম্যানুয়াল কাজ:</p>
                    <ul class="text-[11px] text-yellow-600 space-y-1 list-disc ml-4">
                        <li>নতুন পণ্যের স্টক Products ট্যাব থেকে কমান</li>
                        <li>ড্যামেজ পণ্য <b>রিস্টক করবেন না</b></li>
                    </ul>
                </div>
                <div class="bg-pink-50 border border-pink-200 rounded-lg p-3">
                    <p class="text-[11px] text-pink-700 text-center font-bold">স্ট্যাটাস "Exchange Seller" সেভ হবে<br>পরে আবার Shipped → Delivered দিন</p>
                </div>`,
            showCancelButton:true,
            confirmButtonText:'এক্সচেঞ্জ কনফার্ম',
            confirmButtonColor:'#d33',
            cancelButtonText:'বাতিল',
            focusConfirm:false,
            preConfirm:()=>{
                const courier=parseFloat(document.getElementById('exSellerCourier').value)||0;
                if(courier<=0){Swal.showValidationMessage('নতুন কুরিয়ার চার্জ লিখুন');return false;}
                return {courier,total:existingCost+courier};
            }
        }).then(r=>{
            if(r.isConfirmed){
                const totalCost=r.value.total;
                Swal.fire({title:'প্রসেসিং...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
                // Step 1: স্ট্যাটাস পরিবর্তন
                google.script.run.withSuccessHandler(res=>{
                    if(res.success){
                        // Step 2: ExtraCost সেভ
                        google.script.run.withSuccessHandler(res2=>{
                            if(res2.success){
                                const o=localData.orders.find(x=>x[1]===id);
                                if(o){o[10]='Exchange Seller';o[19]=totalCost;}
                                renderOrders(document.getElementById('contentArea'));
                                Swal.fire({title:'এক্সচেঞ্জ রেকর্ড হয়েছে!',html:`নতুন কুরিয়ার: ৳${r.value.courier}<br>মোট লস: ৳${totalCost}<br><span class="text-[10px] text-gray-400">ইউজার "Exchange Seller" দেখবে</span>`,icon:'success',timer:2500,showConfirmButton:false});
                            }else Swal.fire('Error',res2.error,'error');
                        }).withFailureHandler(e=>Swal.fire('Error',e.toString(),'error')).adminUpdateOrderExtraCost(adminSecret,id,totalCost);
                    }else Swal.fire('Error',res.error,'error');
                }).withFailureHandler(e=>Swal.fire('Error',e.toString(),'error')).adminUpdateOrderStatus(adminSecret,id,'Exchange Seller');
            }
        });
        return;
    }

    // ==========================================
    // ৪. সাধারণ স্ট্যাটাস
    // ==========================================
    Swal.fire({title:`${st}?`,icon:'question',showCancelButton:true}).then(r=>{
        if(r.isConfirmed){
            Swal.fire({title:'Updating...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
            google.script.run.withSuccessHandler(res=>{
                if(res.success){
                    const o=localData.orders.find(x=>x[1]===id);
                    if(o)o[10]=st;
                    renderOrders(document.getElementById('contentArea'));
                    // লোডার বন্ধ হয়ে সাকসেস মেসেজ ১.৫ সেকেন্ড দেখাবে
                    Swal.fire({
                        title: 'সফল হয়েছে!', 
                        text: `স্ট্যাটাস "${st}" এ আপডেট হয়েছে`, 
                        icon: 'success', 
                        timer: 1500, 
                        showConfirmButton: false
                    });
                }else Swal.fire('Error',res.error,'error');
            }).withFailureHandler(e=>Swal.fire('Error',e.toString(),'error')).adminUpdateOrderStatus(adminSecret,id,st);
        }
    });
}
// ==========================================
// PRODUCTS (TYPE MATCHING BUG FIXED)
// ==========================================
function renderProducts(c){
    let trs=localData.products.map(p=>{
        const imgs=[p.imagemain,p.image2,p.image3,p.image4,p.image5].filter(Boolean).map(i=>`<img src="${i}" class="img-thumb" onerror="this.style.display='none'">`).join('');
        return `<tr class="border-b border-gray-100 hover:bg-gray-50"><td class="p-2 text-[10px] font-mono">${p.id}</td><td class="p-2 text-[10px] max-w-[100px] truncate" title="${p.category}">${p.category||'-'}</td><td class="p-2 text-[10px] font-semibold max-w-[120px] truncate">${p.name}</td><td class="p-2 text-[10px]">৳${p.price||0}</td><td class="p-2 text-[10px] text-blue-600">${p.discountprice?'৳'+p.discountprice:'-'}</td><td class="p-2"><div class="flex gap-0.5">${imgs}</div></td><td class="p-2 text-[10px]">${p.videourl?'<i class="fas fa-video text-blue-500"></i>':'-'}</td><td class="p-2 text-[9px] text-gray-400 max-w-[100px] truncate">${p.description?p.description.replace(/<[^>]*>/g,'').substring(0,30)+'...':'-'}</td><td class="p-2 text-[9px] font-bold ${p.stockstatus==='Out of Stock'?'text-red-600':'text-green-600'}">${p.stockstatus||'-'}</td><td class="p-2 text-[10px] text-center">${p.totalstock||0}</td><td class="p-2 text-[10px] text-center">${p.extradeliverycharge||0}</td><td class="p-2 text-[9px] max-w-[120px] truncate" title="${p.variants?p.variants.map(v=>v.name+':'+v.stock).join(', '):''}">${p.variants?p.variants.map(v=>v.name).join(', '):'-'}</td><td class="p-2 text-[10px] text-center">${p.costprice||'-'}</td><td class="p-2 whitespace-nowrap"><button onclick="openProductModal('${p.id}')" class="text-blue-500 p-1 rounded text-xs"><i class="fas fa-edit"></i></button><button onclick="deleteProduct('${p.id}')" class="text-red-500 p-1 rounded text-xs ml-1"><i class="fas fa-trash"></i></button></td></tr>`;
    }).join('');
    c.innerHTML=`<div class="bg-white rounded-xl shadow-sm border overflow-hidden"><div class="p-4 border-b bg-gray-50 flex justify-between items-center"><input type="text" id="pSearch" oninput="filterProducts()" placeholder="Search ID/Name/Category..." class="border rounded-lg px-4 py-2 text-sm w-80 outline-none focus:ring-2 focus:ring-blue-500"><button onclick="openProductModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-xs hover:bg-blue-700"><i class="fas fa-plus mr-1"></i>Add</button></div><div class="tbl-wrap overflow-x-auto"><table class="w-full text-left min-w-[1300px]"><thead><tr class="bg-gray-100 text-[10px] text-gray-600 uppercase"><th class="p-2">ID</th><th class="p-2">Category</th><th class="p-2">Name</th><th class="p-2">Price</th><th class="p-2">Disc.</th><th class="p-2">Images</th><th class="p-2">Video</th><th class="p-2">Desc</th><th class="p-2">Status</th><th class="p-2">Stock</th><th class="p-2">Ex.Del</th><th class="p-2">Variants</th><th class="p-2">Cost</th><th class="p-2">Act</th></tr></thead><tbody id="pTbl">${trs}</tbody></table></div></div>`;
}
function filterProducts(){const k=document.getElementById('pSearch').value.toLowerCase();document.querySelectorAll('#pTbl tr').forEach(r=>{r.style.display=(r.cells[0].textContent.toLowerCase().includes(k)||r.cells[1].textContent.toLowerCase().includes(k)||r.cells[2].textContent.toLowerCase().includes(k))?'':'none';});}

function openProductModal(id=null){
    document.getElementById('productForm').reset();document.getElementById('p_stockstatus').value='In Stock';
    document.getElementById('productModalTitle').innerText=id?"Edit Product":"Add Product";
    // BUG FIX: String() দিয়ে টাইপ ম্যাচিং ঠিক করা হয়েছে (Number vs String সমস্যা সমাধান)
    if(id){const p=localData.products.find(x=>String(x.id)===String(id));if(p){document.getElementById('p_id').value=p.id;document.getElementById('p_id').readOnly=true;document.getElementById('p_name').value=p.name;document.getElementById('p_category').value=p.category;document.getElementById('p_price').value=p.price;document.getElementById('p_discount').value=p.discountprice||'';document.getElementById('p_costprice').value=p.costprice||'';document.getElementById('p_stock').value=p.totalstock;document.getElementById('p_stockstatus').value=p.stockstatus||'In Stock';document.getElementById('p_extra_delivery').value=p.extradeliverycharge||'';document.getElementById('p_image').value=p.imagemain||'';document.getElementById('p_image2').value=p.image2||'';document.getElementById('p_image3').value=p.image3||'';document.getElementById('p_image4').value=p.image4||'';document.getElementById('p_image5').value=p.image5||'';document.getElementById('p_video').value=p.videourl||'';document.getElementById('p_desc').value=p.description||'';if(p.variants)document.getElementById('p_variants').value=p.variants.map(v=>`${v.name}:${v.price}:${v.stock}:${v.extradeliverycharge||0}`).join(', ');}}else{document.getElementById('p_id').readOnly=false;}
    document.getElementById('productModal').classList.remove('hidden');document.getElementById('productModal').classList.add('flex');
}
function closeProductModal(){document.getElementById('productModal').classList.add('hidden');document.getElementById('productModal').classList.remove('flex');}

function saveProduct(){const d={id:document.getElementById('p_id').value.trim(),name:document.getElementById('p_name').value.trim(),category:document.getElementById('p_category').value.trim(),price:parseFloat(document.getElementById('p_price').value)||0,discountprice:parseFloat(document.getElementById('p_discount').value)||0,totalstock:parseInt(document.getElementById('p_stock').value)||0,stockstatus:document.getElementById('p_stockstatus').value,costprice:document.getElementById('p_costprice').value.trim(),extradeliverycharge:parseFloat(document.getElementById('p_extra_delivery').value)||0,imagemain:document.getElementById('p_image').value.trim(),image2:document.getElementById('p_image2').value.trim(),image3:document.getElementById('p_image3').value.trim(),image4:document.getElementById('p_image4').value.trim(),image5:document.getElementById('p_image5').value.trim(),videourl:document.getElementById('p_video').value.trim(),description:document.getElementById('p_desc').value.trim(),variants:document.getElementById('p_variants').value.trim()};if(!d.id||!d.name||!d.price)return Swal.fire('Warning','ID, Name, Price required','warning');Swal.fire({title:'Syncing...',allowOutsideClick:false,didOpen:()=>Swal.showLoading()});google.script.run.withSuccessHandler(res=>{if(res.success){Swal.fire('Saved!','','success');closeProductModal();const idx=localData.products.findIndex(x=>String(x.id)===String(d.id));if(idx>-1)localData.products[idx]={...localData.products[idx],...d};else localData.products.unshift(d);renderProducts(document.getElementById('contentArea'));}else Swal.fire('Error',res.error,'error');}).withFailureHandler(e=>Swal.fire('Error',e.toString(),'error')).adminSaveProduct(adminSecret,d);}

function deleteProduct(id){
    Swal.fire({title:'Delete?',icon:'warning',showCancelButton:true,confirmButtonColor:'#d33'}).then(r=>{
        // BUG FIX: String() দিয়ে টাইপ ম্যাচিং ঠিক করা হয়েছে
        if(r.isConfirmed){google.script.run.withSuccessHandler(res=>{if(res.success){localData.products=localData.products.filter(x=>String(x.id)!==String(id));renderProducts(document.getElementById('contentArea'));}}).adminDeleteProduct(adminSecret,id);}
    });
}
</script>
